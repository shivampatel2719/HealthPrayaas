services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: healthprayaas
      POSTGRES_PASSWORD: healthprayaas
      POSTGRES_DB: healthprayaas
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
